<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --space: #0d0a17;
        --ink: #f5efe8;
        --muted: #a9a3bd;
        --brand: #e98b1e;
        --gold: #e3b23c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--space); }
      #space {
        position: absolute; inset: 0;
        background:
          radial-gradient(900px 700px at 80% 15%, rgba(120, 40, 120, .35), rgba(0,0,0,0) 70%),
          radial-gradient(800px 900px at 10% 85%, rgba(40, 60, 140, .30), rgba(0,0,0,0) 70%),
          var(--space);
      }
      #stars { position: absolute; left: 0; top: -300px; width: 1080px; height: 2520px; }
      .star { position: absolute; border-radius: 50%; background: #fff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="space" data-layout-ignore><div id="stars" data-layout-ignore></div></div>

      <div id="gancho" data-composition-id="gancho" data-composition-src="compositions/gancho.html"
        data-start="0" data-duration="4.3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="jogada" data-composition-id="jogada" data-composition-src="compositions/jogada.html"
        data-start="4.3" data-duration="8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="virada" data-composition-id="virada" data-composition-src="compositions/virada.html"
        data-start="12.3" data-duration="2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="guerra" data-composition-id="guerra" data-composition-src="compositions/guerra.html"
        data-start="14.3" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="premios" data-composition-id="premios" data-composition-src="compositions/premios.html"
        data-start="20.3" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="fim" data-composition-id="fim" data-composition-src="compositions/fim.html"
        data-start="24.3" data-duration="5.7" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 7"></div>

      <!-- Trilha (catálogo HeyGen, 120 bpm): começa em 28 s do arquivo para as batidas fortes cairem em 2,3 / 4,3 / 16 / 20,3 s -->
      <audio id="bgm" class="clip" src="assets/bgm/track.mp3" data-start="0" data-duration="30" data-media-start="28" data-track-index="9" data-volume="0.55" data-fade-in="0.1" data-fade-out="1.6"></audio>
      <!-- Efeitos: o pico de cada arquivo cai 1 frame depois da imagem -->
      <audio id="sfx-carta-sobe" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.93" data-duration="1.8" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-ambicao" class="clip" src="assets/sfx/pop.mp3" data-start="7.61" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-zero" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="8.17" data-duration="0.57" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-vizinho" class="clip" src="assets/sfx/card-flip.mp3" data-start="9.91" data-duration="0.63" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx-orbita" class="clip" src="assets/sfx/whoosh.mp3" data-start="13.38" data-duration="1.8" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-dados" class="clip" src="assets/sfx/dice-roll.mp3" data-start="15.75" data-duration="2.6" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-premios" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="20.06" data-duration="0.81" data-track-index="11" data-volume="0.7"></audio>
      <audio id="sfx-logo" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="26.17" data-duration="0.57" data-track-index="10" data-volume="0.5"></audio>
    </div>
    <script>
      // Starfield: seeded, built once, drifts at constant speed for the whole film (one world under every scene).
      (function () {
        let s = 20241001;
        const rnd = () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
        const host = document.getElementById("stars");
        for (let i = 0; i < 170; i++) {
          const d = document.createElement("div");
          d.className = "star";
          const r = rnd() < 0.85 ? 2 + rnd() * 2 : 4 + rnd() * 3;
          d.style.cssText = `left:${(rnd() * 1080).toFixed(1)}px;top:${(rnd() * 2520).toFixed(1)}px;width:${r.toFixed(1)}px;height:${r.toFixed(1)}px;opacity:${(0.25 + rnd() * 0.65).toFixed(2)}`;
          host.appendChild(d);
        }
      })();
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stars", { y: 0 }, { y: -260, duration: 30, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
