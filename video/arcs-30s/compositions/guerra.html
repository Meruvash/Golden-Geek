  </style>
  <div id="root" data-composition-id="guerra" data-width="1080" data-height="1920">
    <svg id="w-map" viewBox="0 0 1080 1920" data-layout-ignore>
      <defs>
        <radialGradient id="w-sun" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffe2a0"/><stop offset="45%" stop-color="#e3b23c"/><stop offset="100%" stop-color="#e98b1e" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- The outer orbit is the zero from the last scene, continuing. -->
      <ellipse id="w-o3" cx="540" cy="1150" rx="609" ry="168" fill="none" stroke="#e98b1e" stroke-width="21"/>
      <ellipse id="w-o2" cx="540" cy="1150" rx="420" ry="116" fill="none" stroke="#6b5a9a" stroke-width="5"/>

        <path id="w-a2" d="M0,0 L-70,-20 L-54,0 L-70,20 Z" fill="#ff4fb0" transform="translate(190,1100)"/>

  <script>
    const tl = gsap.timeline({ paused: true });
    const words = (sel, t) => tl.fromTo(sel + " .w", { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, t);

    // The zero-orbit cools into the map; the inner orbits, sun and planets build around it.
    tl.fromTo("#w-o3", { attr: { "stroke-width": 21 }, stroke: "#e98b1e" }, { attr: { "stroke-width": 5 }, stroke: "#6b5a9a", duration: 0.6, ease: "power2.inOut" }, 0);
    tl.fromTo("#w-o2, #w-o1", { opacity: 0, scale: 0.6, transformOrigin: "540px 1150px" }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out", stagger: 0.1 }, 0.1);
    tl.fromTo("#w-sunc", { scale: 0, transformOrigin: "540px 1150px" }, { scale: 1, duration: 0.6, ease: "expo.out" }, 0.15);
    tl.fromTo("#w-p1, #w-p2, #w-p3, #w-p4", { scale: 0, transformBox: "fill-box", transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(1.6)", stagger: 0.07 }, 0.35);
    tl.fromTo("#w-pink", { x: -420 }, { x: 0, duration: 0.9, ease: "expo.out" }, 0.5);
    tl.fromTo("#w-cyan", { x: 360 }, { x: 0, duration: 0.9, ease: "expo.out" }, 0.6);
    words("#w-c1", 0.2);

    // Three dice drop and tumble, one per half beat; each lands dead still.
    [["#w-d1", 1.3], ["#w-d2", 1.55], ["#w-d3", 1.8]].forEach(([d, t]) => {
      tl.fromTo(d + " .cube", { y: -760, rotation: -540 }, { y: 0, rotation: 0, duration: 0.6, ease: "back.out(1.2)" }, t);
      tl.fromTo([d + " .lbl", d + " .hint"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, t + 0.45);
    });

    // The attack: the pink fleet dashes, a flash, one cyan ship tumbles away.
    words("#w-c2", 3.45);
    tl.to("#w-pink", { x: 470, y: 80, duration: 0.45, ease: "power3.in" }, 4.0);
    tl.fromTo("#w-flash", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.3, duration: 0.12, ease: "power2.out" }, 4.45);
    tl.to("#w-flash", { opacity: 0, scale: 1.8, duration: 0.4, ease: "power2.out" }, 4.57);
    tl.to("#w-b1", { x: 420, y: 260, rotation: 260, opacity: 0, duration: 0.8, ease: "power2.out", transformBox: "fill-box", transformOrigin: "50% 50%" }, 4.5);

    // Exit: the dice and caption leave fast, upward.
    tl.to(".w-die", { y: -900, opacity: 0, duration: 0.35, ease: "power3.in", stagger: 0.04 }, 5.55);
    tl.to("#w-c2 .w", { opacity: 0, filter: "blur(8px)", duration: 0.15, stagger: 0.02, ease: "power3.in" }, 5.5);
    tl.to("#w-map", { opacity: 0, scale: 1.15, duration: 0.4, ease: "power3.in", transformOrigin: "50% 60%" }, 5.6);
    window.__timelines["guerra"] = tl;
  </script>
