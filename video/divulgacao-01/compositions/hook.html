  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">

    <div id="hook-s2" class="hook-shot clip" data-layout-allow-overflow data-start="0.6" data-duration="0.5"><img id="hook-i2" src="assets/img/ark-nova.jpg" alt="" /></div>
    <div id="hook-s3" class="hook-shot clip" data-layout-allow-overflow data-start="1.1" data-duration="0.5"><img id="hook-i3" src="assets/img/dune-imperium.jpg" alt="" /></div>

  <script>
    const tl = gsap.timeline({ paused: true });
    // Each cut lands slightly large and settles (0.35 s), so the montage feels cut on motion.
    const shots = ["#hook-i1", "#hook-i2", "#hook-i3", "#hook-i4", "#hook-i5", "#hook-i6"];
    const starts = [0, 0.6, 1.1, 1.6, 2.1, 2.6];
    shots.forEach((s, i) => {
      tl.fromTo(s, { scale: 1.12 }, { scale: 1.0, duration: 0.45, ease: "expo.out" }, starts[i]);
    });
    // Frame 0 already carries the line (it is the thumbnail). Exit: words blur out, 60 ms apart.
    tl.fromTo("#hook-title .w", { opacity: 1, filter: "blur(0px)", y: 0 },
      { opacity: 0, filter: "blur(10px)", y: -40, duration: 0.2, ease: "power3.in", stagger: 0.05 }, 2.82);
    tl.fromTo("#hook-kicker", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power3.in" }, 2.82);
    window.__timelines["hook"] = tl;
  </script>
