  <script>
    const tl = gsap.timeline({ paused: true });
    // The wave crashes across on the drop, left to right, in one fast move.
    tl.fromTo("#ap-wave", { x: -1450, y: 60, rotation: -3 }, { x: 1150, y: -30, rotation: 2, duration: 1.7, ease: "power1.inOut" }, 0);
    tl.fromTo("#ap-speed", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.15, ease: "power2.out" }, 0.05);
    tl.to("#ap-speed", { opacity: 0, x: -200, duration: 0.5, ease: "power2.in" }, 1.2);
    // Behind it: the lands are healed, sparks rise.
    tl.fromTo("#ap-sparks", { opacity: 0, y: 20 }, { opacity: 1, y: -60, duration: 1.4, ease: "power2.out" }, 1.0);
    // Fear rises from where the villages stood, and climbs to the meter.
    [["#ap-f1", 1.25], ["#ap-f2", 1.4], ["#ap-f3", 1.55]].forEach(([f, t], i) => {
      tl.fromTo(f, { opacity: 0, scale: 0.3, transformOrigin: "50% 50%", transformBox: "fill-box" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, t);
      tl.to(f, { y: [-280, -300, -330][i], x: [-240, -350, 270][i], scale: 0.5, opacity: 0, duration: 0.7, ease: "power2.in" }, t + 0.75 + i * 0.35);
    });
    // Terror level lights up, I → II → III.
    tl.fromTo("#ap-meter", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 1.6);
    [["#ap-m1", 2.2], ["#ap-m2", 2.6], ["#ap-m3", 3.0]].forEach(([m, t]) => {
      tl.fromTo(m + " circle", { fill: "#1b1036" }, { fill: "#8a4dff", duration: 0.2, ease: "power2.out" }, t);
      tl.fromTo(m, { scale: 1, transformOrigin: "50% 50%", transformBox: "fill-box" }, { scale: 1.18, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
    });
    tl.to("#ap-meter, #ap-sparks", { opacity: 0, y: -40, duration: 0.25, ease: "power3.in" }, 4.2);
    window.__timelines["arte-poder"] = tl;
