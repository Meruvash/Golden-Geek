<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0d1b30; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- 2D art, one world per beat -->
      <div id="arte-ilha" data-composition-id="arte-ilha" data-composition-src="compositions/arte-ilha.html" data-start="0" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="arte-espirito" data-composition-id="arte-espirito" data-composition-src="compositions/arte-espirito.html" data-start="6.5" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="arte-invasores" data-composition-id="arte-invasores" data-composition-src="compositions/arte-invasores.html" data-start="11" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="arte-poder" data-composition-id="arte-poder" data-composition-src="compositions/arte-poder.html" data-start="18" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="arte-caixa" data-composition-id="arte-caixa" data-composition-src="compositions/arte-caixa.html" data-start="22.5" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="arte-fim" data-composition-id="arte-fim" data-composition-src="compositions/arte-fim.html" data-start="26" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <!-- 3D pieces and ships, over the art -->
      <div id="pecas3d" data-composition-id="pecas3d" data-composition-src="compositions/pecas3d.html" data-start="0" data-duration="30" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <!-- all type, on top -->
      <div id="legendas" data-composition-id="legendas" data-composition-src="compositions/legendas.html" data-start="0" data-duration="30" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 8"></div>

      <!-- Music (HeyGen catalog, 120 bpm): starts at 30 s of the file so its big hit at 48 s lands on the wave at 18 s -->
      <audio id="bgm" class="clip" src="assets/bgm/track.mp3" data-start="0" data-duration="30" data-media-start="30" data-track-index="9" data-volume="0.8" data-fade-in="0.2" data-fade-out="1.2"></audio>
      <!-- Effects: each file's peak lands one frame after its picture -->
      <audio id="sfx-espirito" class="clip" src="assets/sfx/sparkle.mp3" data-start="7.51" data-duration="1.8" data-track-index="10" data-volume="0.7"></audio>
      <audio id="sfx-peca1" class="clip" src="assets/sfx/wood-block.mp3" data-start="12.41" data-duration="0.31" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-peca2" class="clip" src="assets/sfx/wood-block.mp3" data-start="13.21" data-duration="0.31" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-peca3" class="clip" src="assets/sfx/wood-block.mp3" data-start="13.81" data-duration="0.31" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-peca4" class="clip" src="assets/sfx/wood-block.mp3" data-start="14.41" data-duration="0.31" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-peca5" class="clip" src="assets/sfx/wood-block.mp3" data-start="14.61" data-duration="0.31" data-track-index="14" data-volume="0.5"></audio>
      <audio id="sfx-onda" class="clip" src="assets/sfx/water-splash-wave.mp3" data-start="14.82" data-duration="5.5" data-track-index="12" data-volume="0.55" data-fade-out="1.5"></audio>
      <audio id="sfx-taiko1" class="clip" src="assets/sfx/taiko-drum-hit.mp3" data-start="17.88" data-duration="0.55" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-taiko2" class="clip" src="assets/sfx/taiko-drum-hit.mp3" data-start="22.78" data-duration="0.55" data-track-index="13" data-volume="0.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
