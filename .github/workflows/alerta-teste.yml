# Teste dos alertas no celular (ntfy): manda um alerta para o canal de TESTE usando o secret NTFY_TOKEN.
# Roda quando este arquivo muda ou pelo botão "Run workflow".
name: "Radar Black: teste de alerta"

on:
  push:
    paths:
      - .github/workflows/alerta-teste.yml
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - name: Manda o alerta de teste
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ -n "$NTFY_TOKEN" ]; then echo "NTFY_TOKEN presente (${#NTFY_TOKEN} caracteres)"; else echo "NTFY_TOKEN ausente"; exit 1; fi
          python3 tools/black/alertas.py --teste | tee saida.txt
          grep -q True saida.txt
