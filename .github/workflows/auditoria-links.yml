# Auditoria de links (pedido do usuário em 04/11/2026): confere que os links de oferta do /black/ e os links de loja
# das resenhas, guias e notícias levam direto à página do produto certo. A cada 6 horas e manual.
# Grava só conteudo/auditoria_links.json e conteudo/auditoria_links.md. Os robôs do Radar Black leem o relatório e
# tiram do /black/ as ofertas com ERRO na próxima geração da página.
# Se houver ERRO em link de oferta que está no /black/, o job termina com falha (o GitHub avisa o dono por e-mail).
name: "Auditoria de links"

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auditoria-links
  cancel-in-progress: false

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests beautifulsoup4 lxml protego
      - name: Audita os links (User-Agent próprio, 1 pedido a cada 2 s por domínio, robots.txt respeitado)
        id: aud
        run: |
          if python3 tools/auditoria_links.py; then echo "falhou=0" >> "$GITHUB_OUTPUT"; else echo "falhou=1" >> "$GITHUB_OUTPUT"; fi
      - name: Grava o relatório na main
        run: |
          git config user.name "Auditoria de links (Elite Boardgamers)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conteudo/auditoria_links.json conteudo/auditoria_links.md
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -q -m "Auditoria de links de $(TZ=America/Sao_Paulo date +'%d/%m/%Y %Hh%M')"
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 7))
          done
          echo "não consegui gravar o relatório"; exit 1
      - name: Falha se algum link de oferta do /black/ não leva à página do produto
        if: steps.aud.outputs.falhou == '1'
        run: |
          echo "Há link de oferta com ERRO no /black/. Veja conteudo/auditoria_links.md."
          exit 1
