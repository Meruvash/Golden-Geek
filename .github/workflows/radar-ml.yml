# Robô do Mercado Livre do Black de Verdade (pedido do usuário em 04/11/2026): terceiro robô, sozinho, só para a API
# do Mercado Livre, em ciclos de 30 minutos (tools/black/robo_ml.py). Grupo de concorrência próprio: não espera nem
# atrasa o robô normal e o educado.
# Este workflow e o do outro robô gravam conteudo/black/, black/ e img/black/ por mescla (cada robô só regrava o que leu).
name: "Radar Black: robô Mercado Livre"

on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/black/ciclo.sh, tools/black/robo_ml.py]   # mudou o ciclo: liga (ou religa) a corrente na hora

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: radar-black-ml
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests Pillow beautifulsoup4 lxml feedparser price-parser protego
      - name: Lê o Mercado Livre e publica, em ciclos de 30 min, e dispara o próximo trabalho
        env:
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSAO: ${{ secrets.TELEGRAM_SESSAO }}
          BSKY_USUARIO: ${{ secrets.BSKY_USUARIO }}
          BSKY_SENHA_APP: ${{ secrets.BSKY_SENHA_APP }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/black/ciclo.sh ml 1800 1500 radar-ml.yml
