# Teste das APIs do Radar Black (tools/black/teste_apis.py): roda à mão ou quando o script muda na main.
# O log mostra só resultados (token ok, quantos produtos lidos, quantas ofertas achadas), nunca as chaves.
name: "Radar Black: teste das APIs"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/black/teste_apis.py]

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python3 tools/black/teste_apis.py
