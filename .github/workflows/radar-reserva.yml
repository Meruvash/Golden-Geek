# Reserva dos robôs do Black de Verdade (pedido do usuário em 04/11/2026: um Actions de backup, sem resultado
# duplicado, que assume quando o outro falha).
#
# O vigia (tools/black/vigia_radar.py) olha cada robô: se o workflow principal tem execução viva e o robô deu
# batimento recente, a reserva não faz nada. Se a corrente do principal quebrou (nenhuma execução viva) ou travou
# (viva, mas sem batimento além do limite: o vigia cancela), a reserva roda o mesmo ciclo (tools/black/ciclo.sh) e,
# no fim, dispara o workflow principal de novo para ele voltar a ser o titular.
#
# Sem duplicata: o trabalho de cada robô aqui usa o MESMO grupo de concorrência do workflow principal
# (radar-black-normal / radar-black-educado). O GitHub nunca roda dois do mesmo grupo ao mesmo tempo.
name: "Radar Black: reserva dos robôs"

on:
  schedule:
    - cron: "17,47 * * * *"   # minutos diferentes dos do principal, para não cair no mesmo atraso do GitHub
  workflow_run:
    workflows: ["Radar Black: robô normal", "Radar Black: robô educado"]
    types: [completed]        # o principal terminou (bem ou mal): confere na hora se a corrente continua
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      normal: ${{ steps.v.outputs.normal }}
      educado: ${{ steps.v.outputs.educado }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300
      - run: pip install requests
      - id: v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/black/vigia_radar.py

  normal:
    name: normal
    needs: vigia
    if: needs.vigia.outputs.normal == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: radar-black-normal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests Pillow beautifulsoup4 lxml feedparser price-parser protego
      - name: Assume o robô normal (mesmo ciclo do principal) e devolve a corrente ao principal no fim
        env:
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSAO: ${{ secrets.TELEGRAM_SESSAO }}
          BSKY_USUARIO: ${{ secrets.BSKY_USUARIO }}
          BSKY_SENHA_APP: ${{ secrets.BSKY_SENHA_APP }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/black/ciclo.sh normal 1800 1500 radar-normal.yml

  educado:
    name: educado
    needs: vigia
    if: needs.vigia.outputs.educado == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: radar-black-educado
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests Pillow beautifulsoup4 lxml feedparser price-parser protego
      - name: Assume o robô educado (mesmo ciclo do principal) e devolve a corrente ao principal no fim
        env:
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSAO: ${{ secrets.TELEGRAM_SESSAO }}
          BSKY_USUARIO: ${{ secrets.BSKY_USUARIO }}
          BSKY_SENHA_APP: ${{ secrets.BSKY_SENHA_APP }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/black/ciclo.sh educado 10800 14400 radar-educado.yml
