# Envia os alertas no celular (ntfy) que as leituras de reserva deixaram em conteudo/black/alertas_fila.json.
# O token NTFY_TOKEN só existe aqui no GitHub; por isso a leitura de reserva enfileira e este workflow envia.
name: "Radar Black: envio dos alertas"

on:
  push:
    paths:
      - conteudo/black/alertas_fila.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-black-alertas
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - name: Envia a fila
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python3 tools/black/alertas.py --fila
      - name: Esvazia a fila no repositório
        run: |
          git config user.name "Radar Black (Elite Boardgamers)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conteudo/black/alertas_fila.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Radar Black: alertas enviados"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep $((i*5)); done
