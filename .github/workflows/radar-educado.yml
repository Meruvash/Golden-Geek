# Robô educado do Black de Verdade: lista inteira a cada 3 horas; varredura completa no domingo às 14h UTC.
# Este workflow e o do outro robô gravam conteudo/black/, black/ e img/black/ por mescla (cada robô só regrava o que leu).
name: "Radar Black: robô educado"

on:
  schedule:
    - cron: "7 2-23/3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: radar-black-educado
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests Pillow beautifulsoup4 lxml feedparser price-parser protego
      - name: Lê os preços e publica, em ciclos (normal 30 min, educado 3 h), e dispara o próximo trabalho
        env:
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/black/ciclo.sh educado 10800 7200 radar-educado.yml
